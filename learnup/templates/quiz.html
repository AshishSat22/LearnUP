{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <div>
        <p class="subtitle"><a href="{{ url_for('subject_view', subject=subject) }}">{{ subject|title }}</a> / Quiz</p>
        <h1>{{ chapter|replace('_', ' ')|title }}</h1>
    </div>
    <div id="quiz-status">
        <span class="btn secondary" id="quiz-timer">00:00</span>
    </div>
</div>

<div class="quiz-container blur-card" style="padding: 2rem;">
    <div id="quiz-content">
        <!-- Quiz questions injected via JS -->
    </div>
    <div class="quiz-nav">
        <button id="btn-prev" class="btn secondary" style="display:none;">Previous</button>
        <button id="btn-next" class="btn primary">Next</button>
        <button id="btn-submit" class="btn primary" style="display:none; background:var(--accent);">Submit Quiz</button>
    </div>
</div>

<!-- Results Modal Placeholder -->
<div id="results-view" class="blur-card animate-slide-up" style="display: none; padding: 2rem; margin-top:2rem; text-align: center;">
    <h2 style="font-size: 2rem; margin-bottom: 1rem;">Quiz Complete!</h2>
    <p id="results-score" style="font-size: 1.5rem; color: var(--accent); margin-bottom: 2rem;"></p>
    <div>
        <a href="{{ url_for('subject_view', subject=subject) }}" class="btn primary">Back to Chapters</a>
        <a href="{{ url_for('scores_view') }}" class="btn secondary">View Analytics</a>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const quizQuestions = {{ questions|tojson }};
const subject = "{{ subject }}";
const chapter = "{{ chapter }}";

let currentIdx = 0;
let score = 0;
const userAnswers = new Array(quizQuestions.length).fill(null);
let tStart = Date.now();
let timerInterval;

const contentDiv = document.getElementById('quiz-content');
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');
const btnSubmit = document.getElementById('btn-submit');
const timerSpan = document.getElementById('quiz-timer');
const resultsView = document.getElementById('results-view');
const navView = document.querySelector('.quiz-nav');
const quizContainer = document.querySelector('.quiz-container');

function updateTimer() {
    let diff = Math.floor((Date.now() - tStart) / 1000);
    let m = Math.floor(diff / 60).toString().padStart(2, '0');
    let s = (diff % 60).toString().padStart(2, '0');
    timerSpan.textContent = `⏱️ ${m}:${s}`;
}

function renderQuestion() {
    if(!quizQuestions || quizQuestions.length === 0){
        contentDiv.innerHTML = "<p>No questions found in this quiz.</p>";
        btnNext.style.display = 'none';
        return;
    }

    const q = quizQuestions[currentIdx];
    let html = `<div class="quiz-header">
        <h3>Question ${currentIdx + 1} of ${quizQuestions.length}</h3>
        <span class="badge" style="background:var(--border-color); padding:4px 8px; border-radius:4px;">${q.difficulty || 'Medium'}</span>
    </div>
    <p style="font-size: 1.2rem; margin-bottom: 1.5rem;">${q.question}</p>
    <div class="options">`;
    
    const isAnswered = userAnswers[currentIdx] !== null;
    q.options.forEach((opt, idx) => {
        let checked = userAnswers[currentIdx] === idx ? 'checked' : '';
        let disabled = isAnswered ? 'disabled' : '';
        let extraStyle = '';
        
        if (isAnswered) {
             if (idx === q.correct_index) {
                 extraStyle = 'background: rgba(40, 167, 69, 0.2); border: 1px solid #28a745;';
             } else if (idx === userAnswers[currentIdx]) {
                 extraStyle = 'background: rgba(220, 53, 69, 0.2); border: 1px solid #dc3545;';
             }
        }

        html += `<label class="option-label" style="${extraStyle}">
            <input type="radio" name="q${currentIdx}" value="${idx}" ${checked} ${disabled}>
            ${opt}
        </label>`;
    });
    html += `</div>`;

    if (isAnswered) {
        if (userAnswers[currentIdx] === q.correct_index) {
            html += `<p style="color: #28a745; font-weight: bold; margin-top: 1rem;">✅ Correct!</p>`;
        } else {
            html += `<p style="color: #dc3545; font-weight: bold; margin-top: 1rem;">❌ Incorrect.</p>`;
        }
    }
    
    contentDiv.innerHTML = html;

    // Attach listeners
    if (!isAnswered) {
        document.querySelectorAll(`input[name="q${currentIdx}"]`).forEach(inp => {
            inp.addEventListener('change', (e) => {
                userAnswers[currentIdx] = parseInt(e.target.value);
                renderQuestion(); // Re-render to show feedback
            });
        });
    }

    btnPrev.style.display = currentIdx > 0 ? 'inline-block' : 'none';
    if(currentIdx === quizQuestions.length - 1){
        btnNext.style.display = 'none';
        btnSubmit.style.display = 'inline-block';
    } else {
        btnNext.style.display = 'inline-block';
        btnSubmit.style.display = 'none';
    }
}

btnNext.addEventListener('click', () => { currentIdx++; renderQuestion(); });
btnPrev.addEventListener('click', () => { currentIdx--; renderQuestion(); });

btnSubmit.addEventListener('click', async () => {
    clearInterval(timerInterval);
    score = 0;
    quizQuestions.forEach((q, i) => {
        if(userAnswers[i] === q.correct_index) score++;
    });
    
    // Save via API
    try {
        await fetch('/api/submit_quiz', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                subject: subject,
                chapter: chapter,
                score: score,
                total: quizQuestions.length,
                difficulty: "Mixed"
            })
        });
    } catch(e) { console.error("Failed to save score"); }
    
    // Show results
    contentDiv.innerHTML = "";
    navView.style.display = 'none';
    quizContainer.style.display = 'none';
    resultsView.style.display = 'block';
    document.getElementById('results-score').textContent = `Score: ${score} / ${quizQuestions.length} (${Math.round(score/quizQuestions.length*100)}%)`;
});

// Init
if(quizQuestions.length > 0) {
    renderQuestion();
    timerInterval = setInterval(updateTimer, 1000);
} else {
    contentDiv.innerHTML = "<p>No questions available.</p>";
    btnNext.style.display = 'none';
}
</script>
{% endblock %}
